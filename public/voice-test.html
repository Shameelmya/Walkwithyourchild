<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Voice test</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; background: #f4f6fb; color: #1d2430; }
  h1 { font-size: 22px; margin: 4px 0 4px; } p { margin: 6px 0; }
  button { font: inherit; font-weight: 700; min-height: 52px; padding: 0 16px; border: 0; border-radius: 14px; background: #2f6fd6; color: #fff; margin: 4px 6px 4px 0; }
  button.alt { background: #e3e8f4; color: #1d2430; }
  #log { background: #fff; border-radius: 14px; padding: 12px; font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; min-height: 120px; }
  a { color: #2f6fd6; font-weight: 700; }
</style>
</head>
<body><main>
<h1>Voice test</h1>
<p>This page uses only the phone's own speech, nothing from the app. Tap each button and listen.</p>
<div>
  <button data-t="en">English</button><button data-t="ml">മലയാളം</button><button data-t="kn">ಕನ್ನಡ</button>
  <button class="alt" data-t="plain">Plain (no language)</button>
</div>
<p><button class="alt" id="copy">Copy result</button> <a href="/settings#voice">Back to the app</a></p>
<div id="log" aria-live="polite"></div>
</main>
<script src="/voice-test.js"></script>
</body>
</html>
